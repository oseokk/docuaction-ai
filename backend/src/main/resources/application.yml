spring:
  application:
    name: DocuAction

  profiles:
    default: local

  jpa:
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

docuaction:
  jwt:
    secret: ${DOCUACTION_JWT_SECRET}
    access-token-expiration-seconds: ${DOCUACTION_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${DOCUACTION_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  storage:
    document-path: ${DOCUACTION_STORAGE_DOCUMENT_PATH:./storage/documents}
  ai:
    provider: ${DOCUACTION_AI_PROVIDER:mock}
  ocr:
    image-provider: ${DOCUACTION_OCR_IMAGE_PROVIDER:unsupported}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${DOCUACTION_OPENAI_MODEL:gpt-5.2}
