spring:
  datasource:
    url: jdbc:h2:mem:docuaction;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true

docuaction:
  jwt:
    secret: ${DOCUACTION_JWT_SECRET:local-development-secret-key-change-before-production-1234567890}
